<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Appel Sofy</title>
<!-- Page de rebond pour les boutons RCS : l'API n'accepte que des URL https,
     pas de lien tel: direct → cette page déclenche le composeur du téléphone. -->
<style>
 body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:#F6F7FB;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
 .c{background:#fff;border-radius:16px;padding:32px 28px;text-align:center;box-shadow:0 4px 24px rgba(20,30,70,.08);max-width:340px}
 a.b{display:inline-block;background:#2B4BF2;color:#fff;text-decoration:none;font-weight:700;font-size:17px;padding:14px 26px;border-radius:12px;margin-top:14px}
 p{color:#5A6172;font-size:14px;line-height:1.5}
</style>
</head>
<body>
<div class="c">
 <div style="font-size:34px">📞</div>
 <h2 style="margin:8px 0 4px">Appel en cours…</h2>
 <p id="msg">Votre téléphone va ouvrir le composeur.</p>
 <a class="b" id="btn" href="#" style="display:none">Lancer l'appel</a>
</div>
<script>
 var t=(new URLSearchParams(location.search).get('tel')||'').replace(/[^+\d]/g,'');
 if(/^\+?\d{9,15}$/.test(t)){
  var b=document.getElementById('btn');
  b.href='tel:'+t; b.textContent='📞 Appeler '+t; b.style.display='inline-block';
  location.href='tel:'+t; // déclenche le composeur immédiatement ; le bouton reste en secours
 }else{
  document.getElementById('msg').textContent='Numéro manquant — contactez votre interlocuteur Sofy habituel.';
 }
</script>
</body>
</html>
